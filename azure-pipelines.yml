trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'kubenews-acr'
  imageRepository: 'kubenews'
  containerRegistry: 'kubenewsacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  imageName: '$(containerRegistry)/$(imageRepository):$(tag)'
  imageNameLatest: '$(containerRegistry)/$(imageRepository):latest'

stages:
  # Stage 1: Provision Infrastructure with Terraform
  - stage: ProvisionInfra
    displayName: Provision Infrastructure
    jobs:
      - job: TerraformJob
        displayName: 'Terraform Apply'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Install Terraform & Apply'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Install Terraform
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update && sudo apt-get install -y terraform

                # Terraform Apply
                cd terraform
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=kubenewstfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=kubenews.tfstate"

                terraform apply -auto-approve \
                  -var="postgres_admin_password=gui24848536"

                # Configure kubectl
                az aks get-credentials \
                  --resource-group rg-kubenews \
                  --name aks-kubenews-dev \
                  --overwrite-existing
                az aks get-credentials \
                  --resource-group rg-kubenews \
                  --name aks-kubenews-prod \
                  --overwrite-existing

                kubectl config get-contexts

  # Stage 2: Build Docker
  - stage: Build
    displayName: Build Docker Image
    dependsOn: ProvisionInfra
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: Build and Push
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js'

          - script: |
              cd src
              npm ci
            displayName: 'Install Dependencies'

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              Dockerfile: '$(dockerfilePath)'
              tags: |
                $(imageName)
                $(imageNameLatest)

          - task: Docker@2
            displayName: 'Push Image to ACR'
            inputs:
              command: 'push'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(imageName)
                $(imageNameLatest)

  # Stage 3: Deploy to Production
  - stage: DeployProd
    displayName: Deploy to Production
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployProdJob
        displayName: Deploy to Prod Cluster
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to Kubernetes'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get credentials
                az aks get-credentials \
                  --resource-group rg-kubenews \
                  --name aks-kubenews-prod \
                  --overwrite-existing

                # Deploy
                kubectl create namespace kubenews --dry-run=client -o yaml | kubectl apply -f -
                kubectl apply -f manifests/deployment.yml -n kubenews
                kubectl apply -f manifests/service.yml -n kubenews
                kubectl rollout status deployment/kubenews -n kubenews
