trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'kubenews-acr'
  imageRepository: 'kubenews'
  containerRegistry: 'kubenewsacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  imageName: '$(containerRegistry)/$(imageRepository):$(tag)'
  imageNameLatest: '$(containerRegistry)/$(imageRepository):latest'

stages:
  # Stage 1: Build
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: BuildJob
        displayName: Build and Push
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js'

          - script: |
              cd src
              npm ci
            displayName: 'Install Dependencies'

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              Dockerfile: '$(dockerfilePath)'
              tags: |
                $(imageName)
                $(imageNameLatest)

          - task: Docker@2
            displayName: 'Push Image to ACR'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'push'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(imageName)
                $(imageNameLatest)

  # Stage 2: Deploy to Dev (on develop)
  - stage: DeployDev
    displayName: Deploy to Dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - job: DeployDevJob
        displayName: Deploy to Dev Cluster
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to Dev AKS'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group rg-kubenews \
                  --name aks-kubenews-dev \
                  --overwrite-existing

                kubectl apply -f manifests/deployment.yml
                kubectl apply -f manifests/service.yml
                kubectl rollout status deployment/kubenews

  # Stage 3: Deploy to Prod (on main)
  - stage: DeployProd
    displayName: Deploy to Production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployProdJob
        displayName: Deploy to Prod Cluster
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to Prod AKS'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group rg-kubenews \
                  --name aks-kubenews-prod \
                  --overwrite-existing

                kubectl create namespace kubenews --dry-run=client -o yaml | kubectl apply -f -
                kubectl apply -f manifests/deployment.yml -n kubenews
                kubectl apply -f manifests/service.yml -n kubenews
                kubectl rollout status deployment/kubenews -n kubenews
